name: Release

on:
  push:
    tags: ['v*']
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        type: string
        required: true
        description: "Tag to publish, e.g. v0.10.0 (used to re-run a release for an existing tag)"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # On a manual tag push github.ref is the tag; when called from
          # auto-release.yml the tag comes via the `tag` input.
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build UI
        run: cd ui && npm install && npm run build
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  homebrew-formula:
    needs: goreleaser
    runs-on: ubuntu-latest
    steps:
      - name: Compute source tarball checksum
        id: vars
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          # Prefer the tag passed in via workflow_call; fall back to the
          # pushed tag ref on a manual `git push origin vX.Y.Z`.
          TAG="${INPUT_TAG:-${GITHUB_REF#refs/tags/}}"
          VERSION="${TAG#v}"
          URL="https://github.com/TillmanBuildsTech/hourglass/archive/refs/tags/${TAG}.tar.gz"
          curl -sL --fail "$URL" -o source.tar.gz
          SHA256=$(sha256sum source.tar.gz | cut -d' ' -f1)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"

      - name: Checkout tap
        uses: actions/checkout@v4
        with:
          repository: TillmanBuildsTech/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          path: tap

      - name: Write formula
        env:
          TAG: ${{ steps.vars.outputs.tag }}
          SHA256: ${{ steps.vars.outputs.sha256 }}
        run: |
          mkdir -p tap/Formula
          rm -f tap/Casks/hourglass.rb
          cat > tap/Formula/hourglass.rb <<EOF
          class Hourglass < Formula
            desc "Self-hosted web UI for managing Linux and macOS cron jobs"
            homepage "https://github.com/TillmanBuildsTech/hourglass"
            url "https://github.com/TillmanBuildsTech/hourglass/archive/refs/tags/${TAG}.tar.gz"
            sha256 "${SHA256}"
            license "MIT"

            depends_on "go" => :build
            depends_on "node" => :build

            def install
              cd "ui" do
                system "npm", "install"
                system "npm", "run", "build"
              end
              system "go", "build", *std_go_args(ldflags: "-s -w"), "."
            end

            # brew services start hourglass — runs as a launchd agent.
            # v0.13.0+: the app defaults to a LAN-reachable bind (0.0.0.0:8080)
            # with mDNS advertisement, so hourglass.local works out of the box
            # from any device (the Home Assistant model). On first run a random
            # password is generated and printed to the log (saved in
            # ~/.hourglass/auth.env) — the instance is never served
            # unauthenticated. To force loopback-only, set
            # HOURGLASS_BIND=127.0.0.1:8080 in
            # ~/Library/LaunchAgents/homebrew.mxcl.hourglass.plist (no
            # credentials needed for loopback), then `brew services restart
            # hourglass`.
            service do
              run [opt_bin/"hourglass"]
              keep_alive true
              log_path var/"log/hourglass.log"
              error_log_path var/"log/hourglass.log"
            end

            test do
              assert_match "hourglass v#{version}", shell_output("#{bin}/hourglass --version")
            end
          end
          EOF

      - name: Commit and push
        working-directory: tap
        env:
          TAG: ${{ steps.vars.outputs.tag }}
        run: |
          git config user.name "goreleaser-bot"
          git config user.email "actions@github.com"
          git add -A
          git diff --cached --quiet || git commit -m "hourglass ${TAG}"
          git push
