version: 2

project_name: hourglass

before:
  hooks:
    - go mod tidy

builds:
  - id: hourglass
    main: .
    binary: hourglass
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  github:
    owner: TillmanBuildsTech
    name: hourglass

# Homebrew distribution is handled separately (see .github/workflows/release.yml,
# job `homebrew-formula`) as a build-from-source Formula rather than a
# goreleaser cask. Casks ship precompiled, unsigned darwin binaries, which
# macOS Gatekeeper quarantines and flags with a security warning. A Formula
# that compiles on the user's machine via `depends_on "go" => :build` avoids
# that entirely, since Gatekeeper only inspects downloaded executables, not
# ones built locally.
