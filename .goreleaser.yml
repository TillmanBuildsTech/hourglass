version: 2

project_name: hourglass

before:
  hooks:
    - go mod tidy

builds:
  - id: hourglass
    main: .
    binary: hourglass
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_{{ .Os }}_{{ .Arch }}

# Linux packages: .deb (Debian/Ubuntu) + .rpm (Fedora/RHEL/openSUSE).
# Ships the systemd unit + config template; postinstall generates
# /etc/hourglass.env with a random password and enables/starts the service.
nfpms:
  - id: packages
    package_name: hourglass
    vendor: TillmanBuildsTech
    homepage: https://github.com/TillmanBuildsTech/hourglass
    maintainer: Tillman Builds Tech <brandon@tillmanbuildstech.com>
    description: >-
      Self-hosted web UI for managing cron jobs. See your scheduled tasks,
      view execution history, and add/edit/delete jobs without touching the
      command line.
    license: MIT
    formats:
      - deb
      - rpm
    contents:
      - src: packaging/hourglass.env
        dst: /usr/share/hourglass/hourglass.env
        # template used by postinstall to seed /etc/hourglass.env
      - src: README.md
        dst: /usr/share/doc/hourglass/README.md
    scripts:
      postinstall: packaging/scripts/postinstall.sh
      preuninstall: packaging/scripts/preuninstall.sh
      postuninstall: packaging/scripts/postuninstall.sh
    overrides:
      rpm:
        contents:
          - src: packaging/hourglass.service
            dst: /usr/lib/systemd/system/hourglass.service
      deb:
        contents:
          - src: packaging/hourglass.service
            dst: /lib/systemd/system/hourglass.service

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  github:
    owner: TillmanBuildsTech
    name: hourglass
